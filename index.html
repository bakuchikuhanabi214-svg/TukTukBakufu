<style>
:root{--o:#ff9f1c;--o2:#e07b00;--r:#e63946;--t:#2a9d8f;--d:#264653;--y:#ffd166;--cream:#fff8ec;--navh:66px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe6ee;font-family:'M PLUS Rounded 1c',system-ui,-apple-system,sans-serif;touch-action:none;color:#3a2a1a}
button{font-family:inherit;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
/* HUD */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 10px 0;display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:10}
#lvl{background:linear-gradient(#2a9d8f,#1f7a70);color:#fff;border-radius:14px;padding:4px 10px;box-shadow:0 3px 0 #145a52;text-align:center;min-width:64px}
#lvl b{display:block;font-size:18px;line-height:1.1}
#lvl small{font-size:9px;display:block;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#moneyBox{flex:1;text-align:center}
#money{display:inline-block;font-size:32px;font-weight:800;color:#fff;background:linear-gradient(#ffcf4a,#ff9f1c);padding:2px 18px 2px 46px;border-radius:22px;box-shadow:0 4px 0 #c46d00,0 6px 12px rgba(0,0,0,.2);position:relative;text-shadow:0 2px 0 #b35c00;letter-spacing:.5px}
#money:before{content:'💰';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:24px;text-shadow:none}
#money.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.12)}}
#evBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + var(--sb) + 8px);z-index:11;pointer-events:none;background:linear-gradient(90deg,#7b2ff7,#e63946);color:#fff;font-size:11px;font-weight:800;padding:2px 10px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.25);max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evch{display:flex;flex-direction:column;gap:8px;margin-top:12px}.evch .btn{width:100%;text-align:left;padding:10px 12px}.evch .btn small{font-weight:500}
#rate{font-size:13px;font-weight:800;color:#1b5e20;background:rgba(255,255,255,.95);display:inline-block;padding:2px 12px;border-radius:12px;margin-top:5px;box-shadow:0 2px 4px rgba(0,0,0,.15);white-space:nowrap}#rate.neg{color:#c1121f}
#dayBox{background:rgba(38,70,83,.92);color:#fff;border-radius:14px;padding:5px 10px 6px;text-align:center;min-width:86px;box-shadow:0 3px 6px rgba(0,0,0,.2)}
#dayBox b{display:block;font-size:15px;line-height:1.15}#dayBox small{display:block;font-size:14px;font-weight:800;color:#ffe08a;white-space:nowrap;line-height:1.2}
#dayBar{height:5px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:2px;overflow:hidden}#dayBar i{display:block;height:100%;background:var(--y);width:0}
#fuel{position:fixed;left:10px;top:calc(var(--st) + 88px);display:flex;align-items:center;gap:4px;max-width:calc(100vw - 140px);background:rgba(255,255,255,.88);padding:3px 8px;border-radius:12px;font-size:12px;font-weight:800;z-index:10;pointer-events:none}
#fuel .bar{width:42px;height:8px;background:#ddd;border-radius:4px;overflow:hidden}#fuel .bar i{display:block;height:100%;background:linear-gradient(90deg,#e63946,#ffd166 40%,#4caf50);width:100%}
#fuel.low{animation:blink 1s infinite}#fuel .cb i{background:linear-gradient(90deg,#8b5a2b,#e9c46a 50%,#3a86ff)!important}#rep{color:#b8860b;margin-left:2px}#rep.bad{color:#c1121f}
#repairBtn{background:linear-gradient(#ffe0b3,#ff9f1c);font-size:20px}#repairBtn small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#264653;color:#fff;font-size:9px;border-radius:6px;padding:0 4px;font-weight:800}
#appChip{position:fixed;left:50%;top:calc(var(--st) + 150px);transform:translateX(-50%);background:#7b2ff7;color:#fff;font-weight:800;font-size:12px;padding:4px 12px;border-radius:12px;z-index:11;pointer-events:none}
.chip.late{background:#ffe3e3;color:#c1121f}.chip.warn{background:#fff3c4}
.shake{animation:shk .3s}@keyframes shk{25%{transform:translate(4px,-2px)}50%{transform:translate(-4px,2px)}75%{transform:translate(2px,1px)}}@keyframes blink{50%{background:#ffb3b3}}
#goal{position:fixed;left:10px;top:calc(var(--st) + 118px);max-width:min(58vw,260px);background:rgba(255,248,236,.95);border:2px solid var(--o);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:800;z-index:10;box-shadow:0 3px 8px rgba(0,0,0,.15);pointer-events:none}
#goal .gt{font-size:10px;color:var(--o2)}
#goal .gp{height:6px;background:#eee;border-radius:3px;margin-top:4px;overflow:hidden}#goal .gp i{display:block;height:100%;background:var(--t)}
#pax{position:fixed;left:10px;top:calc(var(--st) + 184px);display:flex;flex-direction:column;gap:4px;z-index:10;pointer-events:none}
.chip{background:#fff;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:800;box-shadow:0 2px 4px rgba(0,0,0,.15);border-left:6px solid #999}
#hint{position:fixed;left:50%;top:36%;transform:translateX(-50%);background:rgba(38,70,83,.9);color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:800;z-index:11;pointer-events:none;white-space:nowrap}
#mini{position:fixed;right:10px;top:calc(var(--st) + 66px);width:112px;height:112px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:10;background:#9fbf7a;pointer-events:auto;cursor:pointer}
#mapView{position:fixed;inset:0;z-index:58;background:rgba(10,20,30,.92);display:flex;flex-direction:column;align-items:center;justify-content:center}#mapView canvas{width:min(96vw,96vh);height:min(96vw,96vh);touch-action:none}#mapView .mclose{position:absolute;top:calc(var(--st) + 12px);right:14px}#mapView .mtitle{position:absolute;top:calc(var(--st) + 16px);left:16px;color:#fff;font-weight:800;font-size:18px}#mapView .mleg{position:absolute;bottom:calc(var(--sb) + 14px);left:10px;right:10px;color:#fff;font-size:11px;text-align:center;line-height:1.7}
#side{position:fixed;right:10px;top:calc(var(--st) + 200px);display:flex;flex-direction:column;gap:8px;z-index:10}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 #bbb,0 4px 8px rgba(0,0,0,.2);font-size:22px;position:relative}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 #bbb}
.rb .badge{position:absolute;top:-4px;right:-4px;background:var(--r);color:#fff;font-size:11px;border-radius:9px;min-width:18px;height:18px;line-height:18px;font-weight:800}
#phoneBtn{background:linear-gradient(#7b2ff7,#5a17c9);box-shadow:0 3px 0 #3d0d8f}
#joyZone{position:fixed;left:0;bottom:calc(var(--navh) + var(--sb));width:55%;height:46%;z-index:9;touch-action:none}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.6);left:28px;bottom:24px;pointer-events:none;transition:opacity .2s;opacity:.7}
#joyKnob{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffd166 60%,#ff9f1c);left:32px;top:32px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#joyZone.on #joyBase{opacity:1}
#drive{position:fixed;right:12px;bottom:calc(var(--navh) + var(--sb) + 18px);display:flex;gap:10px;align-items:flex-end;z-index:10}
#gearBox{display:flex;flex-direction:column;align-items:center;gap:3px}#gears{display:flex;gap:3px;background:rgba(0,0,0,.4);padding:3px;border-radius:12px}#gears button{width:30px;height:26px;border:0;border-radius:8px;background:#fff;font-weight:800;color:#666;font-size:13px}#gears button.on{background:linear-gradient(#ffd166,#ff9f1c);color:#4a2500}
#speedo{width:88px;height:88px;pointer-events:none}
#footBtn{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(#bde0fe,#3a86ff);color:#fff;font-size:22px;box-shadow:0 4px 0 #1d56b3;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}#footBtn small{font-size:9px;font-weight:800}#footBtn.dis{filter:grayscale(.8);opacity:.6}
body.foot #gearBox,body.foot #brakeBtn,body.foot #hornBtn{display:none}
#punchBtn{display:none;width:66px;height:66px;border-radius:50%;border:0;background:linear-gradient(#ff9a9a,#e63946);color:#fff;font-size:28px;box-shadow:0 4px 0 #9d1c27;flex-direction:column;align-items:center;justify-content:center;line-height:1}#punchBtn small{font-size:10px;font-weight:800}
body.foot #punchBtn{display:flex}body.car #punchBtn{display:none}#punchBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #9d1c27}
#casinoBtn{background:linear-gradient(#ffe066,#d4a017);animation:pop 1s infinite}
#wantedBox{position:fixed;left:50%;top:calc(var(--st) + 150px);transform:translateX(-50%);background:#c1121f;color:#fff;font-weight:800;font-size:13px;padding:5px 14px;border-radius:14px;z-index:12;pointer-events:none;box-shadow:0 0 0 3px #fff,0 4px 14px rgba(0,0,0,.4);animation:wblink .5s infinite alternate;text-align:center}
@keyframes wblink{to{background:#1d4ed8}}#wantedBox small{display:block;font-size:10px;font-weight:500}
#casino{position:fixed;inset:0;z-index:55;background:radial-gradient(ellipse at 50% 0%,#5c0a0a,#1a0505 70%);color:#ffe9a8;display:flex;flex-direction:column;padding:calc(var(--st) + 10px) 12px calc(var(--sb) + 12px);overflow-y:auto;touch-action:pan-y}
#casino h2{margin:0;font-size:20px;color:#ffd700;text-shadow:0 2px 0 #000}#casino .ctop{display:flex;align-items:center;gap:8px}#casino .ctop>div{flex:1}
#cMoney{font-size:28px;font-weight:800;color:#fff}#cMoney.neg{color:#ff6b6b}#cInfo{font-size:11px;opacity:.85}
.ctabs{display:flex;gap:6px;margin:10px 0}.ctabs button{flex:1;border:2px solid #d4a017;background:transparent;color:#ffd700;border-radius:12px;padding:8px;font-weight:800}.ctabs button.on{background:#d4a017;color:#3a0d0d}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button{flex:1;min-width:58px;border:0;border-radius:20px;padding:8px 4px;font-weight:800;background:#2b0a0a;color:#ffd700;box-shadow:inset 0 0 0 2px #d4a017}.chips button.on{background:#ffd700;color:#3a0d0d}
#betTxt{text-align:center;font-weight:800;font-size:16px;margin:4px 0}
.reels{display:flex;gap:8px;justify-content:center;margin:14px 0}.reel{width:84px;height:96px;background:linear-gradient(#fff,#e9e2cf);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 0 0 4px #d4a017}
.reel.spin{animation:rs .1s infinite}@keyframes rs{50%{transform:translateY(4px)}}
.bigbtn{width:100%;border:0;border-radius:18px;padding:14px;font-size:20px;font-weight:800;background:linear-gradient(#ffe066,#d4a017);color:#3a0d0d;box-shadow:0 5px 0 #8a6200;margin-top:8px}.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6200}.bigbtn.dis{filter:grayscale(.7);opacity:.6}
#cResult{text-align:center;min-height:30px;font-size:18px;font-weight:800;margin:6px 0}
.rwheel{width:150px;height:150px;border-radius:50%;margin:12px auto;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#fff;border:8px solid #d4a017;box-shadow:0 0 30px rgba(255,215,0,.4)}
.rbets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.rbets button{border:0;border-radius:12px;padding:10px 4px;font-weight:800;color:#fff;font-size:13px}.rbets button.on{outline:3px solid #ffd700}
.rhist{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px}.rhist span{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.paytab{font-size:11px;opacity:.8;text-align:center;margin-top:8px;line-height:1.6}
#brakeBtn{width:78px;height:78px;border-radius:50%;border:0;background:linear-gradient(#ff6b6b,#e63946);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 0 #a4161a,0 6px 10px rgba(0,0,0,.25)}
#brakeBtn.on,#brakeBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a4161a}
#hornBtn{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(#ffe08a,#ffb703);font-size:24px;box-shadow:0 4px 0 #b77b00}
#hornBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b77b00}
#refuel{position:fixed;left:50%;bottom:calc(var(--navh) + var(--sb) + 120px);transform:translateX(-50%);background:#fff;border-radius:14px;padding:6px 14px;font-weight:800;font-size:13px;z-index:11;box-shadow:0 3px 8px rgba(0,0,0,.2);pointer-events:none}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + var(--sb));padding-bottom:var(--sb);background:linear-gradient(#3d2a1e,#24170f);display:flex;z-index:30;box-shadow:0 -3px 10px rgba(0,0,0,.25)}
#nav button{flex:1;border:0;background:none;color:#f5deb3;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
#nav button span{font-size:24px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
#nav button.on{color:#fff;background:linear-gradient(rgba(255,159,28,.45),rgba(255,159,28,.1))}
#nav button.on:after{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--o);border-radius:0 0 3px 3px}
#nav .dot{position:absolute;top:6px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--r);border:2px solid #24170f}
/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:calc(var(--navh) + var(--sb));height:min(62vh,640px);background:var(--cream);border-radius:22px 22px 0 0;z-index:25;display:flex;flex-direction:column;box-shadow:0 -6px 20px rgba(0,0,0,.25);max-width:720px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheetHead{display:flex;align-items:center;padding:12px 14px 8px;border-bottom:2px dashed #f0d9b5}
#sheetHead h2{margin:0;font-size:19px;flex:1}
#sheetClose{border:0;background:#f0d9b5;width:34px;height:34px;border-radius:50%;font-size:16px;font-weight:800;color:#6b4a2b}
#sheetBody{flex:1;overflow-y:auto;padding:10px 12px 24px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sec{font-size:13px;font-weight:800;color:var(--o2);margin:14px 2px 6px;display:flex;align-items:center;gap:6px}
.sec:first-child{margin-top:2px}
.card{background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 0 #f0d9b5;display:flex;align-items:center;gap:10px}
.card .ic{font-size:30px;width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff3dc;border-radius:12px}
.card .mid{flex:1;min-width:0}
.card .nm{font-weight:800;font-size:14px}
.card .ds{font-size:11px;color:#7a6550;line-height:1.35}
.card.lock{opacity:.55}
.pips{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap}.pips i{width:10px;height:6px;border-radius:2px;background:#eadcc6}.pips i.f{background:var(--t)}
.btn{border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;color:#4a2500;background:linear-gradient(#ffe08a,#ff9f1c);box-shadow:0 3px 0 #c46d00;white-space:nowrap;min-width:72px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c46d00}
.btn.g{background:linear-gradient(#7fe0a6,#2a9d8f);color:#fff;box-shadow:0 3px 0 #1d6f65}
.btn.b{background:linear-gradient(#8ec5ff,#3a86ff);color:#fff;box-shadow:0 3px 0 #1d56b3}
.btn.r{background:linear-gradient(#ff9a9a,#e63946);color:#fff;box-shadow:0 3px 0 #9d1c27}
.btn.p{background:linear-gradient(#c49bff,#7b2ff7);color:#fff;box-shadow:0 3px 0 #4a12a8}
.btn.dis{filter:grayscale(.85);opacity:.55}
.btn.sm{padding:5px 8px;font-size:11px;min-width:0}
.btn small{display:block;font-size:10px;opacity:.85}
.row{display:flex;gap:8px}.row>*{flex:1}
.stat{background:#fff;border-radius:14px;padding:8px;text-align:center;box-shadow:0 2px 0 #f0d9b5}
.stat b{display:block;font-size:18px}.stat small{font-size:10px;color:#7a6550}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;font-size:10px;align-items:center;margin-top:4px}
.bars .bb{height:6px;background:#eee;border-radius:3px;overflow:hidden}.bars .bb i{display:block;height:100%}
table.tb{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:14px;overflow:hidden}
.tb td{padding:5px 8px;border-bottom:1px solid #f5ead8}.tb td:last-child{text-align:right;font-weight:800}
.tb tr.tot td{background:#fff3dc;font-weight:800}
.plus{color:#1b8a3a}.minus{color:#c1121f}
.req{font-size:12px;padding:3px 0}.req.ok{color:#1b8a3a}
.lvlcard{background:linear-gradient(135deg,#2a9d8f,#264653);color:#fff;border-radius:18px;padding:12px;margin-bottom:8px}
.lvlcard h3{margin:0 0 4px;font-size:17px}
.lvlcard .req{color:#ffe8c2}.lvlcard .req.ok{color:#9ff0b5}
canvas.chart{width:100%;height:120px;background:#fff;border-radius:14px;display:block}
/* floats */
#floats{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 0 #1b5e20,0 0 6px rgba(0,0,0,.4);animation:fly 1.3s ease-out forwards;white-space:nowrap}
.ft.small{font-size:16px}.ft.bad{text-shadow:0 2px 0 #9d1c27}.ft.gold{color:#ffe066;text-shadow:0 2px 0 #8a5a00,0 0 8px rgba(0,0,0,.4);font-size:28px}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.coin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc300 55%,#d48a00);box-shadow:0 0 0 2px #b8860b inset;transition:transform .7s cubic-bezier(.5,-0.3,.7,.6),opacity .7s;z-index:21}
/* toasts */
#toasts{position:fixed;left:50%;top:calc(var(--st) + 128px);transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.toast{background:rgba(38,26,16,.92);color:#fff;padding:7px 14px;border-radius:14px;font-size:13px;font-weight:800;animation:tin .25s,tout .4s 2.6s forwards;text-align:center;max-width:100%}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

#modal{position:fixed;inset:0;background:rgba(20,12,6,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}

  if(had&&S.arrive&&!S.arrive.first){const a=S.arrive;S.arrive=null;S.lastSave=Date.now();setTimeout(()=>{SFX.lvl();modal(`<div class="big">${isVN()?'🇻🇳':'🇰🇭'}</div><h2>${CITY.name}に到着</h2><p>${escH(CN())}の${isVN()?'ホーチミン支社':'プノンペン本社'}に戻ってきた。</p>${a.carry?`<table class="tb" style="font-size:12px"><tr><td>持ち出した額</td><td>${fmt(a.carry)}</td></tr><tr><td>${isVN()?'関税':'手数料・税'}</td><td class="minus">-${fmt(a.duty)}</td></tr><tr><td><b>到着した額</b></td><td><b>${fmt(a.net)}</b></td></tr>${a.boost?`<tr><td>ライバル勢力</td><td class="minus">+${a.boost}%</td></tr><tr><td>外資監視</td><td class="minus">${a.heat}日</td></tr>`:''}</table>`:'<p>お金は持ってこなかった。</p>'}<div class="btns"><button class="btn p" data-act="closemodal">再開する</button></div>`);},600);}
  else if(had&&S.justVN){S.justVN=false;const a0=S.arrive;S.arrive=null;S.lastSave=Date.now();setTimeout(()=>{SFX.lvl();modal(`<div class="burst"><span>🇻🇳</span></div><h2>ホーチミン編 開幕！</h2><p>${escH(CN())}はベトナムに上陸した。だがここは甘くない。</p>${a0&&a0.carry?`<p style="font-size:12px">持ち込み ${fmt(a0.carry)} → 関税 -${fmt(a0.duty)} → 到着 <b>${fmt(a0.net)}</b><br>ライバル勢力 +${a0.boost}%・外資監視 ${a0.heat}日</p>`:''}<div style="text-align:left;font-size:13px;line-height:1.7">🚦 <b>信号</b>：赤で交差点に入ると罰金。3回ごとに<b>財産没収</b><br>🧾 <b>累進課税</b>：利益に最大50%の法人税＋手元資金に資産税（毎日）<br>⚔️ <b>ライバル3社</b>：毎日成長し、引き抜き・妨害・値下げで攻撃してくる。客も横取りされる<br>📊 <b>市場シェア</b>：勢力を上げるか、ライバルを<b>買収</b>しよう<br>🚔 警察も手加減なし</div><p><small>経営タブ → 🇻🇳 で状況を確認。全社買収で完全制覇！</small></p><div class="btns"><button class="btn p" data-act="closemodal">受けて立つ！</button></div>`);},600);}
  else if(S.justMoved){S.justMoved=false;S.lastSave=Date.now();SFX.lvl();modal(`<div class="burst"><span>🗺️</span></div><h2>📍 ${CITY.name}に進出！</h2><p>新天地でまた1台のトゥクトゥクから。<br>威光 <b>${S.meta.pts}pt</b> で全運賃 <b>+${S.meta.pts*5}%</b>！</p><p>物価・運賃 ×${CITY.m.toFixed(1)}</p><div class="btns"><button class="btn g" data-act="closemodal">天下統一、再び！</button></div>`);}
  else if(had){const secs=(Date.now()-S.lastSave)/1000;if(secs>60&&D.drivers.length)applyOffline(secs,true);else toast('おかえりなさい！続きから再開します 🛺');}
  else{nameModal(true,()=>modal(`<div class="big">🛺</div><h2>${escH(CN())}、プノンペンで創業！</h2><p>あなたは所持金$10、ボロボロのトゥクトゥク1台の個人ドライバー。</p>
    <ul><li><b>左下をドラッグ</b>（PCは <b>↑/W</b>で前進・<b>↓/S</b>でバック・<b>←→/A D</b>でハンドル）で運転</li><li>頭上に<b>◆</b>がある人に近づくと乗車</li><li><b>光の柱</b>まで⏱制限時間内に運ぶと評判UP＆定刻ボーナス！</li><li>ぶつけると車がボロくなり、評判が落ちると<b>乗車拒否</b>されます</li><li>稼いだお金で強化・車両購入・雇用・建設</li></ul>
    <div class="btns"><button class="btn g" data-act="closemodal">出発する！</button></div>`));}
  if(had&&!S.company)setTimeout(()=>toast('🏢 経営タブ → 設定で「会社名」を付けられるようになりました'),3500);
  save();}
function title(){const b=$('#titleBtns');const hs=hasSave();
  if(hs){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.meta){$('#title .desc').innerHTML=`🏢 ${escH(o.company||DEFAULT_CO)}<br>📍 ${cityDef(o.chapter==='vn'?(o.meta.vcity||0):o.meta.city,o.chapter||'pp').name}編 ・ 威光 ${o.meta.pts}pt`;}}catch(e){}}
  b.innerHTML=hs?`<button class="btn g" id="tContinue">▶ つづきから</button><br><button class="btn" id="tNew" style="font-size:14px;padding:8px 20px">最初から</button>`:`<button class="btn g" id="tStart">▶ はじめる</button>`;
  const go=f=>{const run=()=>start(f);(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(run,run);};
  if(hs){$('#tContinue').onclick=()=>go(false);$('#tNew').onclick=()=>{b.innerHTML=`<p style="font-weight:800;color:#5a2200">本当にデータを消して最初から？</p><button class="btn r" id="tYes">はい</button><button class="btn" id="tNo">いいえ</button>`;$('#tYes').onclick=()=>go(true);$('#tNo').onclick=title;};}
  else $('#tStart').onclick=()=>go(true);}
resize();title();
})();
</script>
